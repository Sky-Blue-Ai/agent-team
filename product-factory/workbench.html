<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品工厂工作台</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#1f2733; --muted:#6b7688;
    --line:#e6eaf1; --brand:#3b5bdb; --brand2:#7048e8;
    --soft:#eef2ff; --shadow:0 2px 10px rgba(30,45,80,.06);
    --c1:#f59f00;--c2:#3b5bdb;--c3:#e64980;--c4:#7048e8;--c5:#228be6;
    --c6:#12b886;--c7:#0ca678;--c8:#f76707;--c9:#495057;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  img{max-width:100%;height:auto}
  .wrap{max-width:1440px;margin:0 auto;padding:24px 20px 60px}
  header.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
  .brand-line{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 18px rgba(59,91,219,.28)}
  h1{font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  button{font-family:inherit;cursor:pointer}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 15px;border-radius:9px;
    font-size:13px;font-weight:600;box-shadow:var(--shadow);transition:.16s}
  .btn:hover{border-color:#c9d2e3;transform:translateY(-1px)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(59,91,219,.25)}
  .btn.primary:hover{background:#324fcf}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .btn.ghost{padding:6px 10px;font-size:12px;box-shadow:none;font-weight:600}
  .btn.danger{color:#e03131}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin:18px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{color:var(--muted);font-size:12px;font-weight:600}
  .stat .v{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:.5px}
  .stat .v small{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
  .flow{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px;overflow-x:auto}
  .flow-title{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:12px;letter-spacing:.5px}
  .flow-row{display:flex;align-items:center;gap:6px;min-width:max-content}
  .flow-step{display:flex;align-items:center;gap:6px}
  .flow-node{display:flex;align-items:center;gap:7px;background:var(--soft);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:#3a4a8a;white-space:nowrap}
  .flow-node i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .flow-node b{font-size:11px;color:#8894c9;font-weight:700}
  .arrow{color:#c3ccdf;font-weight:800}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .toolbar .search{flex:1;min-width:200px;position:relative}
  .toolbar input,.toolbar select,.field input,.field select,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;background:#fff;color:var(--ink);font-family:inherit}
  .toolbar input:focus,.toolbar select:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,91,219,.12)}
  .toolbar select{width:auto;min-width:120px}
  .count-note{color:var(--muted);font-size:12px;margin-left:auto}
  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
  .col{flex:0 0 250px;background:#eef1f7;border-radius:14px;padding:10px;min-height:120px}
  .col-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px}
  .col-h .name{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px}
  .col-h .name i{width:9px;height:9px;border-radius:50%}
  .col-h .num{background:#fff;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800;color:var(--muted);box-shadow:var(--shadow)}
  .cards{display:flex;flex-direction:column;gap:9px}
  .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
  .card:hover{border-color:#c9d2e3;transform:translateY(-2px)}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .card-title{font-weight:800;font-size:14px;line-height:1.35}
  .card-stage{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--soft);color:#3a4a8a;white-space:nowrap}
  .card-prio{display:inline-block;font-size:10px;font-weight:800;padding:1px 7px;border-radius:6px;margin-top:6px}
  .prio-高{background:#fff0f0;color:#c92a2a}.prio-中{background:#fff9e6;color:#e67700}.prio-低{background:#ebfbee;color:#2b8a3e}
  .card-desc{color:#495365;font-size:12px;margin:7px 0 4px}
  .kv{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:5px}
  .kv b{color:#8a93a3;font-weight:700;flex:0 0 auto}
  .card-risk .kv span,.card-next .kv span, .card-metric .kv span{color:#495365}
  .card-foot{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);flex-wrap:wrap}
  .card-foot select{font-size:11px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);max-width:112px}
  .card-owner{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .card-updated{font-size:10px;color:#a4adbb;display:block;margin-top:6px}
  .empty{display:none;text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
  .empty.show{display:block}
  .loading{display:flex;justify-content:center;padding:50px;color:var(--muted);gap:10px;align-items:center}
  .spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .mask{display:none;position:fixed;inset:0;background:rgba(20,28,45,.45);z-index:50;align-items:center;justify-content:center;padding:16px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:620px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(20,30,60,.3)}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal-h h2{margin:0;font-size:18px}
  .x{border:none;background:transparent;font-size:22px;color:var(--muted);line-height:1}
  .modal-b{padding:20px 22px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .field.full{grid-column:1/-1}
  .field label{display:block;font-size:12px;font-weight:700;color:#4a5568;margin-bottom:6px}
  .field textarea{min-height:66px;resize:vertical}
  .modal-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1f2733;color:#fff;
    padding:11px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .fallback{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;color:var(--muted);text-align:center}
  @media(max-width:640px){
    .grid{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr}
    .col{flex-basis:82vw}
    h1{font-size:22px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand-line">
      <div class="logo">✦</div>
      <div>
        <h1>产品工厂工作台</h1>
        <div class="sub">从灵感到动态调整 · 端到端产品流水线</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="refreshBtn" type="button">↻ 刷新</button>
      <button class="btn primary" id="newBtn" type="button">＋ 新建产品</button>
    </div>
  </header>

  <div class="stats" id="stats">
    <div class="stat"><div class="k">产品总数</div><div class="v"><span id="kpiTotal" data-sp-bindable="database" data-sp-database-id="wVFFcD0yitSnGLAl6TaVEo">0</span><small>个</small></div></div>
    <div class="stat"><div class="k">高优先级</div><div class="v"><span id="kpiHigh" data-sp-bindable="database" data-sp-database-id="wVFFcD0yitSnGLAl6TaVEo">0</span><small>个</small></div></div>
    <div class="stat"><div class="k">已上线及以后</div><div class="v"><span id="kpiLive" data-sp-bindable="database" data-sp-database-id="wVFFcD0yitSnGLAl6TaVEo">0</span><small>个</small></div></div>
    <div class="stat"><div class="k">活跃阶段</div><div class="v"><span id="kpiStages" data-sp-bindable="database" data-sp-database-id="wVFFcD0yitSnGLAl6TaVEo">0</span><small>/9</small></div></div>
  </div>

  <section class="flow">
    <div class="flow-title">产品价值流 · 九大阶段</div>
    <div class="flow-row" id="flowRow"></div>
  </section>

  <div class="toolbar">
    <div class="search"><input id="search" type="text" placeholder="搜索产品名称、定位、负责人…"></div>
    <select id="prioFilter"><option value="">全部优先级</option></select>
    <span class="count-note" id="countNote"></span>
  </div>

  <div class="loading" id="loading"><span class="spin"></span> 正在加载数据…</div>
  <div class="empty" id="empty">还没有产品,点击右上角「新建产品」开始吧。</div>
  <div class="board" id="board"></div>

  <!-- 卡片静态结构模板:renderData 生成的每张卡片都遵循此结构,字段绑定类在此声明 -->
  <template id="cardTpl">
    <article class="card">
      <div class="card-top"><h3 class="card-title"></h3><span class="card-stage"></span></div>
      <span class="card-priority"></span>
      <p class="card-desc"></p>
      <div class="kv card-audience"></div>
      <div class="kv card-risk"></div>
      <div class="kv card-next"></div>
      <div class="kv card-metric"></div>
      <span class="card-owner"></span>
      <span class="card-updated"></span>
    </article>
  </template>
</div>

<div class="mask" id="mask">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-h"><h2 id="modalTitle">新建产品</h2><button class="x" id="closeBtn" type="button" aria-label="关闭">×</button></div>
    <form id="form">
      <div class="modal-b">
        <div class="grid">
          <div class="field"><label for="f_pname">产品名称 *</label><input name="pname" id="f_pname" maxlength="80" required></div>
          <div class="field"><label for="f_stage">当前阶段 *</label><select name="stage" id="f_stage" required><option value="">请选择</option></select></div>
          <div class="field full"><label for="f_desc">一句话定位</label><input name="desc" id="f_desc" maxlength="200" placeholder="用一句话说清它是什么、为谁创造什么价值"></div>
          <div class="field"><label for="f_owner">负责人</label><input name="owner" id="f_owner" maxlength="40"></div>
          <div class="field"><label for="f_priority">优先级</label><select name="priority" id="f_priority"><option value="">请选择</option></select></div>
          <div class="field"><label for="f_audience">目标用户</label><input name="audience" id="f_audience" maxlength="120"></div>
          <div class="field"><label for="f_updated">最近更新</label><input name="updated" id="f_updated" type="date"></div>
          <div class="field full"><label for="f_risk">关键假设与风险</label><textarea name="risk" id="f_risk" maxlength="500" placeholder="这个方案成立的前提是什么?最大的不确定性在哪?"></textarea></div>
          <div class="field full"><label for="f_next">下一步行动</label><textarea name="next" id="f_next" maxlength="500" placeholder="下一步要推进的具体动作、负责人与时间"></textarea></div>
          <div class="field full"><label for="f_metric">核心指标</label><input name="metric" id="f_metric" maxlength="200" placeholder="衡量成败的关键指标与目标值"></div>
        </div>
      </div>
      <div class="modal-f">
        <button class="btn" id="cancelBtn" type="button">取消</button>
        <button class="btn primary" id="submitBtn" type="submit">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var smart = (typeof window !== 'undefined' && typeof window.__SMART_PAGE__ !== 'undefined') ? window.__SMART_PAGE__ : null;
  if(!smart || !smart.database){
    var l=document.getElementById('loading'); if(l) l.style.display='none';
    var b=document.getElementById('board');
    if(b){ b.innerHTML='<div class="fallback">当前环境未加载数据服务,已展示静态页面结构。请在 WorkBuddy 资料库页面中使用以启用数据增删改。</div>'; }
    return;
  }
  var db = smart.database;
  var DATABASE_ID = 'wVFFcD0yitSnGLAl6TaVEo';
  var SCHEMA_OPTIONS = {};
  var ALL = [];
  var editingId = '';
  var toastTimer = null;

  var STAGES = [
    {text:'灵感',id:'nzq1bizxbyac6iy8',c:'var(--c1)'},
    {text:'产品规划',id:'5utj0xv0ulqs9vle',c:'var(--c2)'},
    {text:'战略决策',id:'182y17ka6kwavyzv',c:'var(--c3)'},
    {text:'产品设计',id:'mea9llxuqla1i8nc',c:'var(--c4)'},
    {text:'产品开发',id:'o7bbmgo2ocbtjutt',c:'var(--c5)'},
    {text:'产品落地',id:'xk6wd6v922fuaqcf',c:'var(--c6)'},
    {text:'产品上线',id:'nqqa5snoe647prlc',c:'var(--c7)'},
    {text:'推广运营',id:'zxtfkqmtj00e6nsq',c:'var(--c8)'},
    {text:'动态调整',id:'4wyjscgdw4glm9gc',c:'var(--c9)'}
  ];

  var DRAFT_KEY = 'pf_workbench_draft_v1';
  var form = document.getElementById('form');
  var mask = document.getElementById('mask');

  function toast(msg){
    var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ t.classList.remove('show'); },2200);
  }
  function clear(el){ while(el && el.firstChild){ el.removeChild(el.firstChild); } }
  function txt(v){ return v==null ? '' : String(v); }
  function bound(tag,cls,value){
    var e=document.createElement(tag);
    if(cls) e.className=cls;
    e.textContent=txt(value);
    e.setAttribute('data-sp-bindable','database');
    e.setAttribute('data-sp-database-id',DATABASE_ID);
    return e;
  }
  function stageColor(text){
    for(var i=0;i<STAGES.length;i++){ if(STAGES[i].text===text) return STAGES[i].c; }
    return 'var(--c2)';
  }
  function optText(field,val){
    var opts=SCHEMA_OPTIONS[field]||[];
    for(var i=0;i<opts.length;i++){ if(opts[i].id===val || opts[i].text===val) return opts[i].text; }
    return txt(val);
  }
  function stageList(){
    var o=SCHEMA_OPTIONS['当前阶段'];
    return (o && o.length) ? o : STAGES;
  }
  function cacheDraft(){
    try{
      var d={};
      var names=['pname','stage','desc','audience','priority','owner','risk','next','metric','updated'];
      for(var i=0;i<names.length;i++){
        var el=form.querySelector('[name="'+names[i]+'"]');
        if(el) d[names[i]]=el.value;
      }
      localStorage.setItem(DRAFT_KEY,JSON.stringify(d));
    }catch(e){}
  }
  function refillDraft(){
    try{
      var raw=localStorage.getItem(DRAFT_KEY); if(!raw) return;
      var d=JSON.parse(raw);
      var names=['pname','stage','desc','audience','priority','owner','risk','next','metric','updated'];
      for(var i=0;i<names.length;i++){
        if(d[names[i]]==null) continue;
        var el=form.querySelector('[name="'+names[i]+'"]');
        if(el) el.value=d[names[i]];
      }
    }catch(e){}
  }
  function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

  function renderSelectOptions(){
    var s1=document.getElementById('f_stage');
    var s2=document.getElementById('f_priority');
    clear(s1); clear(s2);
    var p=document.createElement('option'); p.value=''; p.textContent='请选择'; s1.appendChild(p); s2.appendChild(p.cloneNode(true));
    var st=stageList();
    for(var i=0;i<st.length;i++){ var o=document.createElement('option'); o.value=st[i].id; o.textContent=st[i].text; s1.appendChild(o); }
    var pr=SCHEMA_OPTIONS['优先级']||[{id:'rxrr8vxkbjei9u2f',text:'高'},{id:'a6yuvyweugntfzxo',text:'中'},{id:'2qyng159hzip7aq4',text:'低'}];
    for(var j=0;j<pr.length;j++){ var q=document.createElement('option'); q.value=pr[j].id; q.textContent=pr[j].text; s2.appendChild(q); }
    var pf=document.getElementById('prioFilter');
    clear(pf); var a=document.createElement('option'); a.value=''; a.textContent='全部优先级'; pf.appendChild(a);
    for(var k=0;k<pr.length;k++){ var r=document.createElement('option'); r.value=pr[k].text; r.textContent=pr[k].text; pf.appendChild(r); }
  }

  db.getSchema({databaseId:DATABASE_ID}).then(function(schema){
    var props=(schema && schema.properties)||[];
    for(var i=0;i<props.length;i++){
      var f=props[i];
      if((f.type==='select'||f.type==='multi_select') && f.config && f.config.options){
        SCHEMA_OPTIONS[f.name]=f.config.options;
      }
    }
  }).catch(function(err){ console.error('[database] schema 加载失败:',err); })
    .then(function(){ renderSelectOptions(); refillDraft(); loadData(); });

  function loadData(startCursor,acc,guard){
    acc=acc||[]; guard=guard||0;
    if(guard>100){ renderData(acc); return; }
    try{
      db.query({databaseId:DATABASE_ID,pageSize:200,startCursor:startCursor}).then(function(result){
        acc=acc.concat(result.results||[]);
        var next=result.nextCursor;
        if(result.hasMore && next && next!==startCursor && (result.results||[]).length){
          loadData(next,acc,guard+1);
        }else{
          renderData(acc);
        }
      }).catch(function(err){
        console.error('[database] 数据加载失败:',err);
        var l=document.getElementById('loading'); if(l) l.style.display='none';
        toast('数据加载失败,请点击刷新重试');
      });
    }catch(err){
      console.error('[database] 数据加载失败:',err);
      toast('数据加载失败,请刷新重试');
    }
  }

  function buildFlow(){
    var row=document.getElementById('flowRow'); clear(row);
    for(var i=0;i<STAGES.length;i++){
      var step=document.createElement('div'); step.className='flow-step';
      var node=document.createElement('div'); node.className='flow-node';
      var dot=document.createElement('i'); dot.style.background=STAGES[i].c;
      var label=document.createElement('span'); label.textContent=STAGES[i].text;
      var num=bound('b','',countStage(STAGES[i].text));
      node.appendChild(dot); node.appendChild(label); node.appendChild(num);
      step.appendChild(node);
      if(i<STAGES.length-1){ var ar=document.createElement('span'); ar.className='arrow'; ar.textContent='→'; step.appendChild(ar); }
      row.appendChild(step);
    }
  }
  function countStage(text){
    var n=0; for(var i=0;i<ALL.length;i++){ if(optText('当前阶段',ALL[i]['当前阶段'])===text) n++; }
    return n;
  }
  function buildBoard(rows){
    var board=document.getElementById('board'); clear(board);
    for(var s=0;s<STAGES.length;s++){
      var stage=STAGES[s].text;
      var col=document.createElement('div'); col.className='col';
      var h=document.createElement('div'); h.className='col-h';
      var name=document.createElement('div'); name.className='name';
      var dot=document.createElement('i'); dot.style.background=STAGES[s].c;
      var nm=document.createElement('span'); nm.textContent=stage;
      name.appendChild(dot); name.appendChild(nm);
      var num=bound('span','num',countStage(stage));
      h.appendChild(name); h.appendChild(num); col.appendChild(h);
      var list=document.createElement('div'); list.className='cards';
      var added=0;
      for(var i=0;i<rows.length;i++){
        if(optText('当前阶段',rows[i]['当前阶段'])===stage){ list.appendChild(makeCard(rows[i])); added++; }
      }
      if(added===0){ var tip=document.createElement('div'); tip.style.cssText='font-size:12px;color:#a4adbb;text-align:center;padding:14px 4px'; tip.textContent='暂无'; list.appendChild(tip); }
      col.appendChild(list); board.appendChild(col);
    }
  }
  function makeCard(row){
    var card=document.createElement('article'); card.className='card';
    var top=document.createElement('div'); top.className='card-top';
    top.appendChild(bound('h3','card-title',row['产品名称']));
    top.appendChild(bound('span','card-stage',optText('当前阶段',row['当前阶段'])));
    card.appendChild(top);

    var pt=row['优先级'] ? optText('优先级',row['优先级']) : '';
    if(pt){ card.appendChild(bound('span','card-priority prio-'+pt,pt)); }

    card.appendChild(bound('p','card-desc',row['一句话定位']||'—'));

    if(row['目标用户']){
      var a=document.createElement('div'); a.className='kv card-audience';
      a.appendChild(bound('b','','目标用户')); a.appendChild(bound('span','',row['目标用户'])); card.appendChild(a);
    }
    if(row['关键假设与风险']){
      var r=document.createElement('div'); r.className='kv card-risk';
      r.appendChild(bound('b','','风险')); r.appendChild(bound('span','',row['关键假设与风险'])); card.appendChild(r);
    }
    if(row['下一步行动']){
      var n=document.createElement('div'); n.className='kv card-next';
      n.appendChild(bound('b','','下一步')); n.appendChild(bound('span','',row['下一步行动'])); card.appendChild(n);
    }
    if(row['核心指标']){
      var m=document.createElement('div'); m.className='kv card-metric';
      m.appendChild(bound('b','','指标')); m.appendChild(bound('span','',row['核心指标'])); card.appendChild(m);
    }

    var foot=document.createElement('div'); foot.className='card-foot';
    var sel=document.createElement('select'); sel.title='移动到阶段';
    var sl=stageList();
    for(var i=0;i<sl.length;i++){ var o=document.createElement('option'); o.value=sl[i].id; o.textContent=sl[i].text;
      if(sl[i].text===optText('当前阶段',row['当前阶段'])) o.selected=true; sel.appendChild(o); }
    (function(rid,selectEl){
      selectEl.addEventListener('change',function(){ moveStage(rid,selectEl.value); });
    })(row._id,sel);
    foot.appendChild(sel);

    var edit=document.createElement('button'); edit.className='btn ghost'; edit.type='button'; edit.textContent='编辑';
    (function(r){ edit.addEventListener('click',function(e){ e.stopPropagation(); openEdit(r); }); })(row);
    foot.appendChild(edit);
    var del=document.createElement('button'); del.className='btn ghost danger'; del.type='button'; del.textContent='删除';
    (function(rid,name){
      del.addEventListener('click',function(e){ e.stopPropagation(); removeRow(rid,name); });
    })(row._id,row['产品名称']);
    foot.appendChild(del);
    foot.appendChild(bound('span','card-owner',row['负责人']?('@'+row['负责人']):''));
    card.appendChild(foot);

    var d=row['最近更新'] ? String(row['最近更新']).slice(0,10) : '';
    card.appendChild(bound('span','card-updated',d?('更新于 '+d):''));

    (function(r){ card.addEventListener('click',function(){ openEdit(r); }); })(row);
    return card;
  }

  function renderData(rows){
    ALL=rows||[];
    var l=document.getElementById('loading'); if(l) l.style.display='none';
    var high=0,live=0,active={};
    for(var i=0;i<ALL.length;i++){
      if(optText('优先级',ALL[i]['优先级'])==='高') high++;
      var st=optText('当前阶段',ALL[i]['当前阶段']);
      if(st==='产品上线'||st==='推广运营'||st==='动态调整') live++;
      active[st]=1;
    }
    setKpi('kpiTotal',ALL.length); setKpi('kpiHigh',high); setKpi('kpiLive',live);
    setKpi('kpiStages',Object.keys(active).length);

    buildFlow();
    applyFilter();
  }
  function setKpi(id,v){
    var el=document.getElementById(id);
    el.textContent=String(v);
    el.setAttribute('data-sp-bindable','database');
    el.setAttribute('data-sp-database-id',DATABASE_ID);
  }
  function applyFilter(){
    var kw=(document.getElementById('search').value||'').trim().toLowerCase();
    var pf=document.getElementById('prioFilter').value;
    var out=[];
    for(var i=0;i<ALL.length;i++){
      var r=ALL[i];
      if(pf && optText('优先级',r['优先级'])!==pf) continue;
      if(kw){
        var blob=[r['产品名称'],r['一句话定位'],r['目标用户'],r['负责人'],r['下一步行动']].join(' ').toLowerCase();
        if(blob.indexOf(kw)<0) continue;
      }
      out.push(r);
    }
    buildBoard(out);
    var note=document.getElementById('countNote');
    note.textContent='显示 '+out.length+' / '+ALL.length+' 个产品';
    var empty=document.getElementById('empty');
    if(ALL.length===0) empty.classList.add('show'); else empty.classList.remove('show');
  }

  function openNew(){
    editingId=''; document.getElementById('modalTitle').textContent='新建产品';
    form.reset();
    var today=new Date(); var ds=today.getFullYear()+'-'+('0'+(today.getMonth()+1)).slice(-2)+'-'+('0'+today.getDate()).slice(-2);
    document.getElementById('f_updated').value=ds;
    refillDraft(); openMask();
  }
  function openEdit(row){
    editingId=row._id; document.getElementById('modalTitle').textContent='编辑产品';
    var set=function(n,v){ var el=form.querySelector('[name="'+n+'"]'); if(el) el.value=v==null?'':v; };
    set('pname',row['产品名称']);
    var stageOpt=stageList(); var sid='';
    for(var i=0;i<stageOpt.length;i++){ if(stageOpt[i].text===optText('当前阶段',row['当前阶段'])) sid=stageOpt[i].id; }
    set('stage',sid);
    set('desc',row['一句话定位']); set('owner',row['负责人']);
    var pr=row['优先级'] ? optText('优先级',row['优先级']) : '';
    var prOpts=SCHEMA_OPTIONS['优先级']||[]; var pid='';
    for(var j=0;j<prOpts.length;j++){ if(prOpts[j].text===pr) pid=prOpts[j].id; }
    set('priority',pid);
    set('audience',row['目标用户']);
    set('updated',row['最近更新']?String(row['最近更新']).slice(0,10):'');
    set('risk',row['关键假设与风险']); set('next',row['下一步行动']); set('metric',row['核心指标']);
    openMask();
  }
  function openMask(){ mask.classList.add('show'); }
  function closeMask(){ mask.classList.remove('show'); }

  function collect(){
    var g=function(n){ var el=form.querySelector('[name="'+n+'"]'); return el?el.value:''; };
    var uv=g('updated');
    var iso='';
    if(uv){ iso=new Date(uv+'T00:00:00Z').toISOString(); }else{ iso=new Date().toISOString(); }
    var p={
      '产品名称':{text:g('pname')},
      '一句话定位':{text:g('desc')},
      '目标用户':{text:g('audience')},
      '负责人':{text:g('owner')},
      '关键假设与风险':{text:g('risk')},
      '下一步行动':{text:g('next')},
      '核心指标':{text:g('metric')},
      '最近更新':{date:iso}
    };
    if(g('stage')) p['当前阶段']={select:g('stage')};
    if(g('priority')) p['优先级']={select:g('priority')};
    return p;
  }

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var btn=document.getElementById('submitBtn'); if(btn.disabled) return;
    if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
    var props=collect();
    var req;
    try{
      req = editingId
        ? db.updateRecord({databaseId:DATABASE_ID,recordId:editingId,properties:props})
        : db.addRecord({databaseId:DATABASE_ID,properties:props});
    }catch(err){
      if(btn){ btn.disabled=false; btn.textContent='保存'; }
      toast('保存失败,请重试'); return;
    }
    req.then(function(){
      clearDraft(); closeMask(); form.reset(); loadData();
      toast(editingId?'已保存修改':'已创建产品');
    }).catch(function(err){
      console.error('[database] 保存失败:',err);
      toast('保存失败,请稍后重试');
    }).then(function(){
      if(btn){ btn.disabled=false; btn.textContent='保存'; }
    });
  });

  function moveStage(rid,val){
    if(!rid) return;
    var req;
    try{ req=db.updateRecord({databaseId:DATABASE_ID,recordId:rid,properties:{'当前阶段':{select:val}}}); }
    catch(err){ toast('操作失败,请重试'); return; }
    req.then(function(){ toast('已更新阶段'); loadData(); })
       .catch(function(err){ console.error('[database] 阶段更新失败:',err); toast('操作失败,请重试'); });
  }
  function removeRow(rid,name){
    if(!rid) return;
    if(!window.confirm('确定删除「'+(name||'该产品')+'」吗?此操作不可撤销。')) return;
    var req;
    try{ req=db.deleteRecord({databaseId:DATABASE_ID,recordId:rid}); }
    catch(err){ toast('删除失败,请重试'); return; }
    req.then(function(){ toast('已删除'); loadData(); })
       .catch(function(err){ console.error('[database] 删除失败:',err); toast('删除失败,请重试'); });
  }

  document.getElementById('newBtn').addEventListener('click',openNew);
  document.getElementById('closeBtn').addEventListener('click',closeMask);
  document.getElementById('cancelBtn').addEventListener('click',closeMask);
  mask.addEventListener('click',function(e){ if(e.target===mask) closeMask(); });
  document.getElementById('refreshBtn').addEventListener('click',function(){ loadData(); });
  document.getElementById('search').addEventListener('input',applyFilter);
  document.getElementById('prioFilter').addEventListener('change',applyFilter);
  form.addEventListener('input',cacheDraft);
  form.addEventListener('change',cacheDraft);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && mask.classList.contains('show')) closeMask(); });
})();
</script>
</body>
</html>
